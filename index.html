  <!-- Critical CSS: paint correct background + hide skip link before the JS bundle loads -->
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      html {
        background-color: #0a0618;
      }
      html[data-theme='light'] {
        background-color: #f8f9fc;
      }
      body {
        background: inherit;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      .skip-link {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
      .skip-link:focus {
        left: 1rem;
        top: 1rem;
        z-index: 9999;
        width: auto;
        height: auto;
        margin: 0;
        padding: 0.75rem 1.25rem;
        overflow: visible;
        clip: auto;
        clip-path: none;
        background: #6d28d9;
        color: #fff;
        font-weight: 600;
        font-size: 0.875rem;
        border-radius: 0.5rem;
        text-decoration: none;
      }
      #root {
        min-height: 100dvh;
      }
      .app-boot {
        display: flex;
        min-height: 100dvh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: inherit;
      }
      .app-boot__spinner {
        width: 2.5rem;
        height: 2.5rem;
        border: 2px solid rgba(139, 92, 246, 0.3);
        border-top-color: #a78bfa;
        border-radius: 50%;
        animation: app-boot-spin 0.8s linear infinite;
      }
      @keyframes app-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .app-boot__label {
        font-size: 0.75rem;
        font-weight: 500;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.65);
      }
      html[data-theme='light'] .app-boot__label {
        color: #64748b;
      }
      /* Hero shell — paint before async CSS (mobile LCP) */
      .cinematic-hero {
        position: relative;
        display: flex;
        min-height: 100dvh;
        max-height: 100dvh;
        width: 100%;
        overflow: hidden;
        contain: layout style;
      }
      .hero-cinematic-media-wrap {
        position: absolute;
        inset: 0;
        pointer-events: none;
        contain: strict;
      }
      .hero-cinematic-media-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      html[data-theme='dark'] .cinematic-hero--dark,
      html:not([data-theme='light']) .cinematic-hero--dark {
        background-color: #0a0618;
      }
      html[data-theme='light'] .cinematic-hero--light {
        background-color: #f0f4fa;
      }
      #ifr-static-hero {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
      }
      #ifr-static-hero .hero-static-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 42%;
      }
      html[data-theme='light'] #ifr-static-hero .hero-static-img {
        object-position: center 38%;
      }
      #ifr-static-hero.ifr-static-hero--hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .site-navbar {
        height: 4rem;
        min-height: 4rem;
      }
      .site-navbar-logo-mark-wrap {
        width: 2.5rem;
        height: 2.5rem;
        flex-shrink: 0;
      }
      @media (min-width: 640px) {
        .site-navbar-logo-mark-wrap {
          width: 2.75rem;
          height: 2.75rem;
        }
      }
      @media (min-width: 768px) and (max-width: 1279px) {
        .site-navbar {
          height: 5rem;
          min-height: 5rem;
        }
        .site-navbar-logo-mark-wrap {
          width: 3.5rem;
          height: 3.5rem;
        }
      }
      /* Reserve hero copy space before React hydrates (reduces CLS) */
      #main-content .hero-cinematic-layout {
        min-height: calc(100dvh - 4rem);
        padding-top: 6.5rem;
      }
      #main-content .hero-cinematic-content {
        min-height: 17rem;
      }
      @media (min-width: 640px) {
        #main-content .hero-cinematic-layout {
          padding-top: 4rem;
        }
        #main-content .hero-cinematic-content {
          min-height: 14rem;
        }
      }
    </style>
